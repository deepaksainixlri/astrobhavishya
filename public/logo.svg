<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4920B"/>
      <stop offset="50%" style="stop-color:#E8A317"/>
      <stop offset="100%" style="stop-color:#F5B041"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B041"/>
      <stop offset="100%" style="stop-color:#D4920B"/>
    </linearGradient>
  </defs>

  <!-- Sun/Star Symbol -->
  <g transform="translate(30, 30)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#saffronGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Sun rays -->
    <g opacity="0.6">
      <line x1="0" y1="-26" x2="0" y2="-22" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="18.4" y1="-18.4" x2="15.6" y2="-15.6" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="0" x2="22" y2="0" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="18.4" y1="18.4" x2="15.6" y2="15.6" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="0" y2="22" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="-18.4" y1="18.4" x2="-15.6" y2="15.6" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="-26" y1="0" x2="-22" y2="0" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
      <line x1="-18.4" y1="-18.4" x2="-15.6" y2="-15.6" stroke="#E8A317" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Inner decorative ring -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#saffronGrad)" stroke-width="1" opacity="0.3"/>

    <!-- Central sun -->
    <circle cx="0" cy="0" r="12" fill="url(#sunGrad)"/>

    <!-- Om symbol stylized as a simple mark -->
    <text x="0" y="5" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#FFFDF5">ॐ</text>
  </g>

  <!-- Brand Text -->
  <text x="62" y="28" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#2C1810">
    Astro<tspan fill="url(#saffronGrad)">Bhavishya</tspan>
  </text>

  <!-- Tagline -->
  <text x="62" y="46" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#8B7355" letter-spacing="2">
    VEDIC ASTROLOGY · AI POWERED
  </text>
</svg>