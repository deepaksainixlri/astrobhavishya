<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B041"/>
      <stop offset="100%" style="stop-color:#D4920B"/>
    </linearGradient>
  </defs>
  <g transform="translate(32, 32)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#E8A317" stroke-width="2" opacity="0.4"/>
    <!-- Sun rays -->
    <g opacity="0.6">
      <line x1="0" y1="-31" x2="0" y2="-28" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="21.9" y1="-21.9" x2="19.8" y2="-19.8" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="31" y1="0" x2="28" y2="0" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="21.9" y1="21.9" x2="19.8" y2="19.8" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="31" x2="0" y2="28" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-21.9" y1="21.9" x2="-19.8" y2="19.8" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-31" y1="0" x2="-28" y2="0" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-21.9" y1="-21.9" x2="-19.8" y2="-19.8" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#E8A317" stroke-width="1" opacity="0.25"/>
    <!-- Sun circle -->
    <circle cx="0" cy="0" r="16" fill="url(#sg)"/>
    <!-- Om symbol -->
    <text x="0" y="6" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#FFFDF5">ॐ</text>
  </g>
</svg>